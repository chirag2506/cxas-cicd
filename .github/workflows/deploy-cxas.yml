name: Deploy CX Agent Studio App

on:
  push:
    branches:
      - git_agent_copt
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation OIDC token

env:
  LOCATION: us
  TARGET_APP_ID:  ${{ secrets.TARGET_APP_ID }}
  SOURCE_APP_ID: agents/temp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install cxas-scrapi
        run: |
          python -m pip install --upgrade pip
          pip install cxas-scrapi

      # - name: Validate Agent Configuration (Optional)
      #   run: |
      #     cxas lint

      - name: Deploy to CX Agent Studio
        run: |
          cxas push --to projects/${{ secrets.GCP_PROJECT_ID }}/locations/${{ env.LOCATION }}/apps/${{ env.TARGET_APP_ID }} --app-dir ${{ env.SOURCE_APP_ID }} 